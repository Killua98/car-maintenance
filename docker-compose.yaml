services:
  car-maintenance-app:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1001}
        USER_GID: ${USER_GID:-1001}
    image: ghcr.io/killua98/car-maintenance:dev
    container_name: car-maintenance-app
    ports:
      - "2662:2662"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
